services:
  logto:
    image: svhd/logto:1.45
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - TRUST_PROXY_HEADER=1
      - DB_URL=postgres://logto:${POSTGRES_PASSWORD}@postgres:5432/logto
      - ENDPOINT=${LOGTO_ENDPOINT:-http://localhost:3001}
      - ADMIN_ENDPOINT=${LOGTO_ADMIN_ENDPOINT:-http://localhost:3002}
      # Logto blocks outbound webhook calls to private addresses; allow only this stack's network
      # (User.Deleted -> http://hub:3030/webhooks/logto).
      - SSRF_ALLOWED_ADDRESSES=${COMPOSE_SUBNET:-172.31.240.0/24}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: logto
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Localhost only: host-side `npm run hub:db:init` / `hub:migrate` / tests.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dev/test only: receives the http-email devFallback connector's messages (codes at GET /).
  mailbox:
    image: node:22-alpine
    profiles: ["dev", "test"]
    command: ["node", "/app/dev-mailbox.js"]
    volumes:
      - ./scripts/dev-mailbox.js:/app/dev-mailbox.js:ro
    ports:
      - "3099:3099"
    restart: unless-stopped

  # Cloudflare email relay (EMAIL_PROVIDER=cloudflare): Logto's http-email connector posts to
  # http://email-relay:3096/email; templates come from config. Opt-in: `--profile cloudflare`.
  email-relay:
    image: node:22-alpine
    profiles: ["cloudflare"]
    command: ["node", "/app/apps/email-relay/server.js"]
    env_file:
      - .env
    volumes:
      - ./package.json:/app/package.json:ro
      - ./apps/email-relay:/app/apps/email-relay:ro
      - ./apps/lib:/app/apps/lib:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3096/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Test only: mock third-party provider (OAuth 2.0 server + APIs + control API) for E2E.
  mock-provider:
    image: node:24-alpine
    profiles: ["test"]
    working_dir: /app
    command: ["node", "test/mock-provider/server.js"]
    volumes:
      - ./test/mock-provider:/app/test/mock-provider:ro
    ports:
      - "3097:3097"
    restart: unless-stopped

  # Connector Hub. Needs `npm run provision`, `npm run hub:db:init`, `npm run hub:migrate` first;
  # until then it exits and restarts. Reaches Logto/Postgres by service name; tokens keep the
  # public issuer (LOGTO_ENDPOINT).
  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    profiles: ["dev", "test"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - path: .env.apps
        required: false
    environment:
      NODE_ENV: ${HUB_NODE_ENV:-development}
      HUB_DATABASE_URL: postgres://hub:${HUB_DB_PASSWORD}@postgres:5432/hub
      LOGTO_INTERNAL_ENDPOINT: http://logto:3001
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.240.0/24}

volumes:
  pgdata:
